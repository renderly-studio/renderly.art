name: Deploy to GitHub Pages

on:
  # Lanza el workflow en cada push a main
  push:
    branches: [main]
  # Permite ejecutarlo a mano desde la pestaña Actions
  workflow_dispatch:

# Permisos para que la action pueda clonar el repo y publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues solapados; no cancela uno en curso
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        # with:
        #   path: .            # raíz del proyecto Astro (opcional)
        #   node-version: 24   # versión de Node (por defecto 24)
        #   package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
